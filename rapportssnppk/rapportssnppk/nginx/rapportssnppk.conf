server {
    listen 443 ssl http2;
    server_name rapportssnppk.cgwgroups.com;
    # Remplacez ces chemins par ceux de votre gestionnaire TLS existant.
    ssl_certificate /etc/letsencrypt/live/rapportssnppk.cgwgroups.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rapportssnppk.cgwgroups.com/privkey.pem;
    location / { proxy_pass http://127.0.0.1:9080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
}
server { listen 80; server_name rapportssnppk.cgwgroups.com; return 301 https://$host$request_uri; }
